<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit de dades de la Confederació — FASE 1 Dades Reals</title>
<link rel="stylesheet" href="dashboard_real.html" type="text/css">
</head>
<body onload="initDashboard()">
<div class="app">
  <header class="hdr">
    <svg class="cross" viewBox="0 0 26 26"><rect x="1" y="1" width="24" height="24" fill="none" stroke="#000" stroke-width="1.5"/><text x="13" y="18" font-size="12" font-weight="700" text-anchor="middle">CH</text></svg>
    <h1>Cockpit de dades de la Confederació<small>FASE 1: Dades Reals · 26 cantons · 35 indicadors</small></h1>
    <div class="grow"></div>
    <div class="hdr-meta">
      <div>Actualitzat<b id="updated">—</b></div>
      <div>Població<b>8.7M</b></div>
      <div>Cobertura<b id="coverage">—</b></div>
    </div>
  </header>
  <div class="redrule"></div>

  <div class="bar">
    <div class="lbl">Escenari</div>
    <div class="seg" id="scenButtons"></div>
    <div style="margin-left:20px" class="lbl">Any</div>
    <div class="yearbox">
      <div class="yearval"><span id="yearDisplay">2024</span><span id="yearStatus">observat</span></div>
      <input type="range" id="yearSlider" min="2015" max="2024" value="2024" style="flex:1">
      <div id="yearMarks" style="display:flex; gap:4px; font-family:var(--mono); font-size:9px; color:var(--ink-3)"></div>
    </div>
  </div>

  <div class="body">
    <div class="side" id="sidebar"></div>
    <div class="center">
      <div class="kstrip" id="kstrip"></div>
      <div class="mapbox" id="mapbox">
        <svg id="mapSvg" viewBox="0 0 1000 641" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="strip">
        <div id="panel1"></div>
        <div id="panel2"></div>
      </div>
    </div>
    <div class="rail" id="rail"></div>
  </div>
</div>

<div id="tip" style="position:fixed; background:#fff; border:1px solid #ccc; padding:8px; font-size:11px; pointer-events:none; opacity:0; z-index:100"></div>

<script>
// ============================================================================
// FASE 1: CARREGAR DADES REALS I RENDERITZAR DASHBOARD FIDEL AL MOCKUP
// ============================================================================

let realData = null;
let state = {
  scenario: 'base',
  year: 2024,
  domain: null,
  metric: null,
  canton: null
};

// Cantons amb info bàsica
const CANTONS = [
  {ab:"ZH",name:"Zuric",pop:1564400,area:1728,cap:"Zuric",lang:"Alemany",c:[497,231],bb:[480,200,550,300],d:"M..."},
  {ab:"BE",name:"Berna",pop:1062000,area:5959,cap:"Berna",lang:"Alemany",c:[420,380],bb:[380,350,500,450],d:"M..."},
  {ab:"LU",name:"Lucerna",pop:426400,area:1493,cap:"Lucerna",lang:"Alemany",c:[450,380],bb:[430,360,480,420],d:"M..."},
  {ab:"UR",name:"Uri",pop:36700,area:1077,cap:"Altdorf",lang:"Alemany",c:[480,420],bb:[460,400,510,450],d:"M..."},
  {ab:"SZ",name:"Schwyz",pop:162600,area:908,cap:"Schwyz",lang:"Alemany",c:[500,400],bb:[480,380,530,430],d:"M..."},
  {ab:"OW",name:"Obwalden",pop:39200,area:491,cap:"Sarnen",lang:"Alemany",c:[470,400],bb:[450,380,500,420],d:"M..."},
  {ab:"NW",name:"Nidwalden",pop:43300,area:276,cap:"Stans",lang:"Alemany",c:[480,390],bb:[460,370,510,410],d:"M..."},
  {ab:"GL",name:"Glarus",pop:42200,area:685,cap:"Glarus",lang:"Alemany",c:[520,370],bb:[500,350,550,400],d:"M..."},
  {ab:"ZG",name:"Zug",pop:131200,area:239,cap:"Zug",lang:"Alemany",c:[490,350],bb:[470,330,520,380],d:"M..."},
  {ab:"FR",name:"Friburg",pop:334300,area:1671,cap:"Friburg",lang:"Francés/Alemany",c:[400,420],bb:[370,400,450,460],d:"M..."},
  {ab:"SO",name:"Soloturn",pop:288300,area:791,cap:"Soloturn",lang:"Alemany",c:[420,360],bb:[400,340,460,390],d:"M..."},
  {ab:"BS",name:"Basilea-Ciudad",pop:195900,area:165,cap:"Basilea",lang:"Alemany",c:[370,300],bb:[350,280,400,320],d:"M..."},
  {ab:"BL",name:"Basilea-Campiña",pop:296400,area:518,cap:"Liestal",lang:"Alemany",c:[400,310],bb:[380,290,440,340],d:"M..."},
  {ab:"SH",name:"Schaffhausen",pop:88800,area:298,cap:"Schaffhausen",lang:"Alemany",c:[450,270],bb:[430,250,480,300],d:"M..."},
  {ab:"AR",name:"Appenzell Rhodes Externes",pop:55700,area:173,cap:"Herisau",lang:"Alemany",c:[540,320],bb:[520,300,570,350],d:"M..."},
  {ab:"AI",name:"Appenzell Rhodes Internes",pop:16400,area:173,cap:"Appenzell",lang:"Alemany",c:[550,330],bb:[530,310,580,360],d:"M..."},
  {ab:"SG",name:"St. Gallen",pop:530800,area:2026,cap:"St. Gallen",lang:"Alemany",c:[560,360],bb:[530,330,600,400],d:"M..."},
  {ab:"GR",name:"Grisó",pop:199648,area:7105,cap:"Coira",lang:"Alemany/Romànic",c:[600,400],bb:[550,350,650,450],d:"M..."},
  {ab:"AG",name:"Argòvia",pop:690700,area:1404,cap:"Aarau",lang:"Alemany",c:[430,340],bb:[400,320,470,370],d:"M..."},
  {ab:"TG",name:"Turgòvia",pop:280600,area:991,cap:"Frauenfeld",lang:"Alemany",c:[500,310],bb:[470,290,540,340],d:"M..."},
  {ab:"TI",name:"Ticino",pop:353600,area:2812,cap:"Bellinzona",lang:"Italià",c:[580,500],bb:[550,480,620,530],d:"M..."},
  {ab:"VD",name:"Vaud",pop:866400,area:3212,cap:"Lausana",lang:"Francés",c:[380,480],bb:[340,450,430,530],d:"M..."},
  {ab:"VS",name:"Valais",pop:348500,area:5224,cap:"Sió",lang:"Francés",c:[420,520],bb:[370,490,480,560],d:"M..."},
  {ab:"NE",name:"Neuchâtel",pop:178600,area:803,cap:"Neuchâtel",lang:"Francés",c:[400,380],bb:[370,360,440,410],d:"M..."},
  {ab:"JU",name:"Jura",pop:73400,area:838,cap:"Delémont",lang:"Francés",c:[380,350],bb:[350,330,420,380],d:"M..."},
  {ab:"GE",name:"Ginebra",pop:511100,area:282,cap:"Ginebra",lang:"Francés",c:[350,520],bb:[320,500,390,550],d:"M..."}
];

async function loadRealData() {
  try {
    const response = await fetch('data/processed/real_data_hybrid.json');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    realData = await response.json();

    document.getElementById('updated').textContent = new Date().toLocaleDateString('ca-ES', {month:'short', day:'2-digit'});
    document.getElementById('coverage').textContent = realData.metadata.coverage;

    initializeDashboard();
  } catch (e) {
    console.error('Error carregant dades:', e);
    document.body.innerHTML = '<p style="padding:20px; color:red;">❌ Error: No es pot carregar el fitxer de dades real. Assegureu-vos que existeix <code>data/processed/real_data_hybrid.json</code></p>';
  }
}

function initializeDashboard() {
  if (!realData) return;

  // Inicialitzar domini i mètrica
  state.domain = realData.domains[0];
  state.metric = state.domain.metrics[0];

  // Renderitzar barra lateral
  renderSidebar();

  // Renderitzar botons d'escenari
  renderScenarioButtons();

  // Renderitzar slider d'anys
  renderYearSlider();

  // Renderitzar panell complet
  render();
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '<h3>Àmbits</h3>';

  realData.domains.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'dom';
    btn.setAttribute('aria-pressed', String(d.id === state.domain.id));
    btn.innerHTML = `<i style="background:${d.acc}"></i>${d.label}`;
    btn.onclick = () => {
      state.domain = d;
      state.metric = d.metrics[0];
      render();
    };
    sidebar.appendChild(btn);
  });

  const hr = document.createElement('hr');
  sidebar.appendChild(hr);

  const h = document.createElement('h3');
  h.textContent = 'Indicadors';
  sidebar.appendChild(h);

  state.domain.metrics.forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'ind';
    btn.setAttribute('aria-pressed', String(m.id === state.metric.id));
    btn.textContent = m.label;
    btn.onclick = () => {
      state.metric = m;
      render();
    };
    sidebar.appendChild(btn);
  });
}

function renderScenarioButtons() {
  const container = document.getElementById('scenButtons');
  container.innerHTML = '';

  ['opt', 'base', 'str'].forEach(sc => {
    const label = {opt: 'Acord', base: 'Tendencial', str: 'Estrès'}[sc];
    const btn = document.createElement('button');
    btn.className = 'seg button';
    btn.setAttribute('aria-pressed', String(sc === state.scenario));
    btn.textContent = label;
    btn.onclick = () => {
      state.scenario = sc;
      document.getElementById('yearDisplay').textContent = state.year;
      render();
    };
    container.appendChild(btn);
  });
}

function renderYearSlider() {
  const slider = document.getElementById('yearSlider');
  const display = document.getElementById('yearDisplay');
  const status = document.getElementById('yearStatus');

  slider.oninput = (e) => {
    state.year = parseInt(e.target.value);
    display.textContent = state.year;
    status.textContent = state.year <= 2024 ? 'observat' : 'previsió';
    render();
  };

  // Marques d'anys
  const marks = document.getElementById('yearMarks');
  marks.innerHTML = '';
  for (let y = 2015; y <= 2024; y += 3) {
    const span = document.createElement('span');
    span.textContent = y;
    marks.appendChild(span);
  }
}

function getMetricValue(canton, metric) {
  const metric_data = metric;
  if (!metric_data.years || !metric_data.years[state.year]) {
    return metric_data.years['2024'] || 0;
  }
  return metric_data.years[state.year];
}

function render() {
  if (!realData) return;

  // Actualitzar KPI strip
  renderKPIs();

  // Actualitzar mapa
  renderMap();

  // Actualitzar panells
  renderPanels();
}

function renderKPIs() {
  const kstrip = document.getElementById('kstrip');
  kstrip.innerHTML = '';

  state.domain.metrics.forEach(m => {
    const value = getMetricValue(null, m);
    const prevValue = m.years['2023'] || value;
    const delta = ((value - prevValue) / prevValue * 100).toFixed(1);
    const good = (m.better === 'low' ? delta < 0 : delta > 0);
    const trend = Math.abs(delta) < 0.25 ? 'flat' : (good ? 'up' : 'down');

    const btn = document.createElement('button');
    btn.className = 'k';
    btn.setAttribute('aria-pressed', String(m.id === state.metric.id));
    btn.innerHTML = `
      <span class="kn">${m.label}</span>
      <span class="kv">${value.toFixed(m.dec || 1)}<span class="ku">${m.unit}</span></span>
      <span class="kd ${trend}">${delta >= 0 ? '▲ +' : '▼ '}${Math.abs(delta)}% (2023)</span>
    `;
    btn.onclick = () => {
      state.metric = m;
      render();
    };
    kstrip.appendChild(btn);
  });
}

function renderMap() {
  const mapbox = document.getElementById('mapbox');
  const svg = document.getElementById('mapSvg');

  // Generar SVG simplificat amb rectangles per als cantons
  let svgHtml = `<svg viewBox="0 0 1000 641" width="100%" height="100%">`;

  CANTONS.forEach(c => {
    const value = Math.random() * 100; // Placeholder
    const opacity = 0.2 + (value / 100) * 0.8;

    svgHtml += `
      <rect x="${c.bb[0]}" y="${c.bb[1]}" width="${c.bb[2] - c.bb[0]}" height="${c.bb[3] - c.bb[1]}"
            fill="${state.domain.acc}" opacity="${opacity}"
            stroke="#fff" stroke-width="2"
            style="cursor:pointer" onclick="alert('${c.name}')"/>
      <text x="${c.c[0]}" y="${c.c[1]}" font-size="12" text-anchor="middle" font-weight="bold">${c.ab}</text>
    `;
  });

  svgHtml += '</svg>';
  svg.outerHTML = svgHtml;
}

function renderPanels() {
  // Panell 1: Gràfic d'evolució
  const panel1 = document.getElementById('panel1');
  panel1.innerHTML = `
    <div class="p">
      <header><h2>Evolució 2015–2024</h2></header>
      <div class="c">
        <p style="color:#666; font-size:11px;">${state.metric.label}</p>
        <p style="font-size:18px; font-weight:bold;">${getMetricValue(null, state.metric).toFixed(state.metric.dec || 1)} ${state.metric.unit}</p>
        <p style="color:#999; font-size:11px;">Font: ${state.metric.source}</p>
      </div>
    </div>
  `;

  // Panell 2: Metadades
  const panel2 = document.getElementById('panel2');
  panel2.innerHTML = `
    <div class="p">
      <header><h2>Metadades</h2></header>
      <div class="c">
        <p><strong>Dataset:</strong><br/>${realData.metadata.coverage}</p>
        <p><strong>Font:</strong><br/>${state.metric.source}</p>
        <p><strong>Actualitzat:</strong><br/>${realData.metadata.generated}</p>
      </div>
    </div>
  `;
}

function initDashboard() {
  loadRealData();
}
</script>
</body>
</html>
