[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiss-governance-dashboard"
version = "0.1.0"
description = "Real-time urban governance dashboard for Swiss cantons with AI-powered insights"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0"}
authors = [{name = "Gemma Gardela", email = "gemmagardela@gmail.com"}]
keywords = ["governance", "urban-planning", "switzerland", "data-dashboard", "ai", "probabilistic-forecasting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Government",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "pyarrow>=15.0.0",
    "plotly>=5.20.0",
    "folium>=0.14.0",
    "geojson>=2.5.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "notebook>=7.0.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "pymc>=5.10.0",
    "arviz>=0.17.0",
    "causalml>=0.12.0",
]

[tool.setuptools]
packages = ["src"]
